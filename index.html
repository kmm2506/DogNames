<!DOCTYPE html>
<html>

<head>
    <title>
        hello
    </title>
</head>

<body>
    <script src="libs/sql-wasm-inline.js"></script>

    <table border="1" id="dogsTable">
        <thead></thead>
        <tbody></tbody>
    </table>


    <script>
        async function loadDatabase() {

            // Initialize SQLite
            const SQL = await initSqlJs();

            // Load database
            const response = await fetch("data/data.db");
            const buffer = await response.arrayBuffer();

            const db = new SQL.Database(new Uint8Array(buffer));

            // Execute SQL
            const result = db.exec("SELECT * FROM dogs LIMIT 20");

            if (result.length > 0) {
                const columns = result[0].columns;
                const rows = result[0].values;

                document.querySelector("#dogsTable thead").innerHTML =
                    "<tr>" + columns.map(c => `<th>${c}</th>`).join("") + "</tr>";

                document.querySelector("#dogsTable tbody").innerHTML =
                    rows.map(row =>
                        "<tr>" + row.map(v => `<td>${v ?? ""}</td>`).join("") + "</tr>"
                    ).join("");
            }

            db.close();
        }

        loadDatabase();
    </script>
</body>

</html>
